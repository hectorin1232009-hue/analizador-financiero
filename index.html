<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analista Financiero Pro</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --bg: #0e1117; --card: #161b22; --text: #f0f6fc; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; }
        .sector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .btn-sector { background: var(--card); border: 1px solid #30363d; color: var(--text); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; flex-direction: column; align-items: center; }
        .btn-sector span { font-size: 11px; font-weight: normal; color: #8b949e; margin-top: 4px; }
        .btn-sector.active { border-color: #58a6ff; background: #1f2937; }
        .action-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        .action-table th, .action-table td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 14px; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-green { background: #1f6feb; color: #58a6ff; }
        .badge-yellow { background: #bf8e00; color: #fff; }
        .badge-red { background: #da3633; color: #fff; }
        .details-box { background: var(--card); border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; text-align: center; }
        .metric-card { background: #21262d; padding: 10px; border-radius: 6px; }
        .metric-card p { margin: 5px 0 0 0; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>📊 Analista Financiero Pro</h2>
        <p style="color: #8b949e; font-size: 14px; margin: 5px 0;">Ranking de Momentum y Valor Intrínseco</p>
    </div>

    <h3>🏹 1. Rotación de Capital (Sectores)</h3>
    <div class="sector-grid" id="sectors"></div>

    <h3>🚦 2. Semáforo de Acciones del Sector</h3>
    <table class="action-table">
        <thead>
            <tr>
                <th>Estado</th>
                <th>Ticker</th>
                <th>Precio</th>
                <th>V. Intrínseco</th>
            </tr>
        </thead>
        <tbody id="actions-list"></tbody>
    </table>

    <div id="details-section" style="display:none;">
        <h3>🔍 3. Reporte de Inversión y Escenarios</h3>
        <div class="details-box">
            <h4 id="det-name" style="margin:0 0 10px 0;"></h4>
            <div class="metrics">
                <div class="metric-card" style="border-bottom: 3px solid #da3633;"><small>Conservador</small><p id="scen-con"></p></div>
                <div class="metric-card" style="border-bottom: 3px solid #58a6ff;"><small>Neutral (Base)</small><p id="scen-neu"></p></div>
                <div class="metric-card" style="border-bottom: 3px solid #238636;"><small>Optimista</small><p id="scen-opt"></p></div>
            </div>
            <strong>📝 Argumentación del Analista:</strong>
            <ul id="det-reasons" style="padding-left: 20px; font-size: 13px; color: #c9d1d9; line-height: 1.6;"></ul>
            <canvas id="miniChart" style="width:100%; max-height:160px; margin-top:15px;"></canvas>
        </div>
    </div>

    <script>
        const DATA = {
            "Tecnología": { score: "0.142", actions: [
                { tk: "NVDA", name: "NVIDIA Corp.", px: 135.20, vi: 148.50, cat: "green", r: ["Fuerte demanda sostenida de infraestructura IA.", "Márgenes operativos superiores al 60%.", "Soporte técnico por encima de la media de 200 días."] },
                { tk: "AAPL", name: "Apple Inc.", px: 224.50, vi: 210.00, cat: "yellow", r: ["Valoración justa según flujos de caja actuales.", "Crecimiento de servicios estable pero hardware plano."] },
                { tk: "INTC", name: "Intel Corp.", px: 22.10, vi: 15.30, cat: "red", r: ["Pérdida de cuota de mercado frente a competidores.", "Estructura de costes deteriorada y altos niveles de deuda."] }
            ]},
            "Finanzas": { score: "0.089", actions: [
                { tk: "JPM", name: "JPMorgan Chase & Co.", px: 212.40, vi: 235.00, cat: "green", r: ["Líder indiscutible en banca con crecimiento neto de depósitos.", "Retorno sobre el capital (ROE) por encima de la media del sector."] },
                { tk: "GS", name: "Goldman Sachs Group", px: 465.00, vi: 450.00, cat: "yellow", r: ["Dependencia de la reactivación de fusiones y adquisiciones macro."] },
                { tk: "BAC", name: "Bank of America", px: 39.50, vi: 31.00, cat: "red", r: ["Mayor sensibilidad a la compresión de márgenes por tipos de interés."] }
            ]},
            "Energía": { score: "0.041", actions: [
                { tk: "XOM", name: "Exxon Mobil Corp.", px: 118.90, vi: 132.00, cat: "green", r: ["Excelente generación de flujo de caja libre (*Free Cash Flow*).", "Plan agresivo de reducción de costes operativos estructurales."] },
                { tk: "CVX", name: "Chevron Corp.", px: 151.20, vi: 155.00, cat: "yellow", r: ["Producción estable pero dependiente de la estabilización del Brent."] },
                { tk: "APA", name: "APA Corp.", px: 24.50, vi: 18.00, cat: "red", r: ["Alta volatilidad operativa y balances más apalancados."] }
            ]}
        };

        let chartInstance = null;

        function loadApp() {
            const sectorsDiv = document.getElementById("sectors");
            const sortedSectors = Object.keys(DATA).sort((a,b) => DATA[b].score - DATA[a].score);
            
            sectorsDiv.innerHTML = "";
            sortedSectors.forEach((sec, idx) => {
                const btn = document.createElement("button");
                btn.className = `btn-sector ${idx === 0 ? 'active' : ''}`;
                btn.innerHTML = `📌 ${sec} <span>Score: ${(DATA[sec].score * 100).toFixed(1)}%</span>`;
                btn.onclick = () => {
                    document.querySelectorAll(".btn-sector").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    showActions(sec);
                };
                sectorsDiv.appendChild(btn);
            });
            showActions(sortedSectors);
        }

        function showActions(sector) {
            const tbody = document.getElementById("actions-list");
            tbody.innerHTML = "";
            
            DATA[sector].actions.forEach(act => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.onclick = () => showDetails(act);
                
                let badgeClass = "badge-green", badgeText = "🟢 Top 5";
                if(act.cat === "yellow") { badgeClass = "badge-yellow"; badgeText = "🟡 Neutral"; }
                if(act.cat === "red") { badgeClass = "badge-red"; badgeText = "🔴 Evitar"; }

                tr.innerHTML = `
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    <td><strong>${act.tk}</strong><br><small style="color:#8b949e">${act.name}</small></td>
                    <td>$${act.px.toFixed(2)}</td>
                    <td>$${act.vi.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById("details-section").style.display = "none";
        }

        function showDetails(act) {
            document.getElementById("details-section").style.display = "block";
            document.getElementById("det-name").innerText = `${act.name} (${act.tk})`;
            document.getElementById("scen-con").innerText = `$${(act.vi * 0.75).toFixed(2)}`;
            document.getElementById("scen-neu").innerText = `$${act.vi.toFixed(2)}`;
            document.getElementById("scen-opt").innerText = `$${(act.vi * 1.20).toFixed(2)}`;
            
            const ul = document.getElementById("det-reasons");
            ul.innerHTML = act.r.map(txt => `<li>${txt}</li>`).join("");

            const ctx = document.getElementById('miniChart').getContext('2d');
            if (chartInstance) { chartInstance.destroy(); }
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Mes 1', 'Mes 2', 'Mes 3', 'Mes 4', 'Mes 5', 'Actual'],
                    datasets: [{
                        label: 'Evolución Cotización',
                        data: [act.px * 0.9, act.px * 0.95, act.px * 0.93, act.px * 1.02, act.px * 0.98, act.px],
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.1)',
                        borderWidth: 2,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#30363d' } } } }
            });
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        window.onload = loadApp;
    </script>
</body>
</html>
